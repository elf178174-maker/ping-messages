name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for the release (e.g. 1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decode the release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No RELEASE_KEYSTORE_BASE64 secret is set."
            echo "The release APK will be signed with the debug identity, which is fine for"
            echo "testing but cannot be used for a Play Store upload or an in-place update"
            echo "of an existing install. See README > Signing releases."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        working-directory: android
        # A release is the one build that must not ship a known-broken app, so the tests gate
        # it rather than running only on branch pushes.
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Build the signed release APK and AAB
        working-directory: android
        env:
          RELEASE_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PING_API_BASE_URL: ${{ vars.PING_API_BASE_URL }}
          PING_STUN_SERVERS: ${{ vars.PING_STUN_SERVERS }}
        run: >-
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
          -PpingVersionCode=${{ steps.version.outputs.code }}
          -PpingVersionName=${{ steps.version.outputs.name }}

      - name: Collect the artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/ping-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "artifacts/ping-${{ steps.version.outputs.name }}.aab"
          (cd artifacts && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt

      - name: Upload the artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ping-release-${{ steps.version.outputs.name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ping ${{ steps.version.outputs.name }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.name, '-') }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            ### Install

            Download `ping-${{ steps.version.outputs.name }}.apk` below and open it on your
            Android device (Android 8.0 or newer). Verify the download against
            `SHA256SUMS.txt` if you like.

            Signed with a release key: **${{ steps.keystore.outputs.signed }}**
