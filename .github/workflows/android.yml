name: Android CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md", "backend/**"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md", "backend/**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false

jobs:
  build:
    name: Lint, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Derive version numbers from the commit history
        id: version
        run: |
          # Monotonic version code: the number of commits on this branch.
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.$VERSION_CODE"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      # Compilation first: it is the fastest signal, and a Kotlin error reported here is far
      # easier to read than the same error surfacing from inside a lint or assemble task.
      - name: Compile
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble the debug APK
        working-directory: android
        run: >-
          ./gradlew :app:assembleDebug --stacktrace
          -PpingVersionCode=${{ steps.version.outputs.code }}
          -PpingVersionName=${{ steps.version.outputs.name }}
        env:
          PING_API_BASE_URL: ${{ vars.PING_API_BASE_URL }}
          PING_STUN_SERVERS: ${{ vars.PING_STUN_SERVERS }}

      - name: Assemble the release APK
        working-directory: android
        run: >-
          ./gradlew :app:assembleRelease --stacktrace
          -PpingVersionCode=${{ steps.version.outputs.code }}
          -PpingVersionName=${{ steps.version.outputs.name }}
        env:
          PING_API_BASE_URL: ${{ vars.PING_API_BASE_URL }}
          PING_STUN_SERVERS: ${{ vars.PING_STUN_SERVERS }}

      - name: Rename the APKs so downloads are self-describing
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/ping-${{ steps.version.outputs.name }}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/ping-${{ steps.version.outputs.name }}-release.apk"
          ls -lh artifacts

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ping-debug-apk
          path: artifacts/ping-*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: ping-release-apk
          path: artifacts/ping-*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.sarif
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarise the build
        if: always()
        run: |
          {
            echo "## Ping build ${{ steps.version.outputs.name }}"
            echo
            if [ -d artifacts ]; then
              echo "| Artifact | Size |"
              echo "| --- | --- |"
              for f in artifacts/*.apk; do
                [ -e "$f" ] || continue
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
              echo
              echo "Download them from the **Artifacts** section at the bottom of this run's summary page."
            else
              echo "No APK was produced — check the job logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
