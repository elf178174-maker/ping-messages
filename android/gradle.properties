# JVM settings for the Gradle daemon. 4 GB keeps KSP + Kotlin compilation comfortable
# on CI runners while staying well under the 7 GB available on GitHub-hosted runners.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
# Left off deliberately: the Hilt + KSP + AGP combination pinned here is not fully
# configuration-cache clean. Build cache and parallel execution still apply.
org.gradle.configuration-cache=false

# AndroidX is required by every dependency in this project.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official
ksp.incremental=true
